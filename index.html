<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Spin Arisan dengan Foto</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f7f6;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }
        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas {
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        input[type="file"] {
            font-size: 12px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #2ecc71;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        #spin-btn {
            background-color: #e67e22;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 10px;
        }
        #spin-btn:hover {
            background-color: #d35400;
        }
        .name-list {
            list-style: none;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .name-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
        }
        .name-item:last-child {
            border-bottom: none;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .thumb-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .delete-btn {
            background-color: #e74c3c;
            padding: 4px 8px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
        .winner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .winner-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .winner-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 10px;
            border: 3px solid #f1c40f;
        }
    </style>
</head>
<body>

    <h1>Spin Arisan Online</h1>

    <div class="container">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="400" height="400"></canvas>
            <button id="spin-btn" onclick="spin()">PUTAR ARISAN!</button>
        </div>

        <div class="controls">
            <h3>Daftar Peserta</h3>
            <div class="input-group">
                <input type="text" id="name-input" placeholder="Masukkan nama...">
                <div class="input-row">
                    <input type="file" id="photo-input" accept="image/*">
                    <button onclick="addParticipant()">Tambah</button>
                </div>
            </div>
            <ul id="name-list" class="name-list"></ul>
        </div>
    </div>

    <div id="winner-modal" class="winner-modal">
        <div class="winner-content">
            <h2>Selamat! 🎉</h2>
            <div id="winner-photo-container"></div>
            <p id="winner-name" style="font-size: 24px; font-weight: bold; color: #2c3e50; margin: 10px 0;"></p>
            <button onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        // Data awal peserta (menggunakan foto placeholder SVG secara bawaan)
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";

        let participants = [
            { name: "Budi", photo: defaultAvatar, imgObj: null },
            { name: "Siti", photo: defaultAvatar, imgObj: null },
            { name: "Agus", photo: defaultAvatar, imgObj: null },
            { name: "Dewi", photo: defaultAvatar, imgObj: null }
        ];

        const colors = ["#f39c12", "#1abc9c", "#9b59b6", "#e74c3c", "#3498db", "#2ecc71", "#34495e"];
        
        let startAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Memuat Image Object untuk Canvas
        function loadImages(callback) {
            let loaded = 0;
            if (participants.length === 0) {
                if (callback) callback();
                return;
            }
            participants.forEach(p => {
                const img = new Image();
                img.src = p.photo;
                img.onload = () => {
                    p.imgObj = img;
                    loaded++;
                    if (loaded === participants.length && callback) callback();
                };
            });
        }

        function drawWheel() {
            if (participants.length === 0) {
                ctx.clearRect(0, 0, 400, 400);
                return;
            }

            const arc = Math.PI / (participants.length / 2);
            ctx.clearRect(0, 0, 400, 400);

            for (let i = 0; i < participants.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                // Gambar jorong/bagian roda
                ctx.beginPath();
                ctx.arc(200, 200, 180, angle, angle + arc, false);
                ctx.arc(200, 200, 0, angle + arc, angle, true);
                ctx.fill();

                ctx.save();
                ctx.translate(200 + Math.cos(angle + arc / 2) * 120, 200 + Math.sin(angle + arc / 2) * 120);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                
                // Gambar Nama
                ctx.fillStyle = "white";
                ctx.font = "bold 14px sans-serif";
                const text = participants[i].name;
                ctx.fillText(text, -ctx.measureText(text).width / 2, -10);

                // Gambar Foto Melingkar
                if (participants[i].imgObj) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 15, 18, 0, Math.PI * 2, true);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(participants[i].imgObj, -18, -3, 36, 36);
                    ctx.restore();
                }

                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arclen = 360 / participants.length;
            const index = Math.floor((360 - degrees % 360) / arclen);
            const winner = participants[index < 0 ? index + participants.length : index];
            
            showWinner(winner);
            isSpinning = false;
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function spin() {
            if (isSpinning || participants.length < 2) {
                if(participants.length < 2) alert("Masukkan minimal 2 peserta!");
                return;
            }
            isSpinning = true;
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function updateUI() {
            const list = document.getElementById("name-list");
            list.innerHTML = "";
            participants.forEach((p, index) => {
                const li = document.createElement("li");
                li.className = "name-item";
                li.innerHTML = `
                    <div class="user-info">
                        <img src="${p.photo}" class="thumb-img">
                        <span>${p.name}</span>
                    </div>
                    <button class="delete-btn" onclick="removeParticipant(${index})">Hapus</button>
                `;
                list.appendChild(li);
            });

            loadImages(() => {
                drawWheel();
            });
        }

        function addParticipant() {
            const nameInput = document.getElementById("name-input");
            const photoInput = document.getElementById("photo-input");
            const name = nameInput.value.trim();

            if (!name) {
                alert("Silakan masukkan nama!");
                return;
            }

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    participants.push({ name: name, photo: e.target.result, imgObj: null });
                    resetForm();
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                participants.push({ name: name, photo: defaultAvatar, imgObj: null });
                resetForm();
            }
        }

        function resetForm() {
            document.getElementById("name-input").value = "";
            document.getElementById("photo-input").value = "";
            updateUI();
        }

        function removeParticipant(index) {
            participants.splice(index, 1);
            updateUI();
        }

        function showWinner(winner) {
            document.getElementById("winner-name").innerText = winner.name;
            const container = document.getElementById("winner-photo-container");
            container.innerHTML = `<img src="${winner.photo}" class="winner-avatar">`;
            document.getElementById("winner-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("winner-modal").style.display = "none";
        }

        document.getElementById("name-input").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') addParticipant();
        });

        updateUI();
    </script>
</body>
</html>
